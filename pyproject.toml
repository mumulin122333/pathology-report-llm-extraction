[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathology-report-llm-extraction"
version = "0.1.0"
description = "Extract and evaluate structured data from pathology reports"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Brenton Lin" }
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]
dependencies = []

[project.scripts]
pathology-report-extract = "extraction.extract:main"
pathology-report-score = "evaluation.evaluate:main"

[tool.setuptools.packages.find]
include = ["evaluation*", "extraction*"]

[tool.setuptools.package-data]
extraction = ["models.json"]
